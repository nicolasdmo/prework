<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0814">
<title>Para Belén</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Marcellus&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #050309;
    font-family: 'Cormorant Garamond', serif;
    user-select: none;
    -webkit-user-select: none;
    color: #f5e6d3;
  }

  body {
    background:
      radial-gradient(ellipse at 30% 20%, #2a1838 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, #3a1a25 0%, transparent 55%),
      radial-gradient(ellipse at center, #15102a 0%, #0a0814 60%, #050309 100%);
  }

  /* === CIELO ESTRELLADO === */
  .sky {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 25%, rgba(255, 230, 180, 0.7), transparent),
      radial-gradient(1px 1px at 55% 65%, rgba(255, 220, 180, 0.5), transparent),
      radial-gradient(1.5px 1.5px at 78% 18%, rgba(255, 240, 200, 0.6), transparent),
      radial-gradient(1px 1px at 32% 82%, rgba(255, 225, 190, 0.4), transparent),
      radial-gradient(2px 2px at 88% 48%, rgba(255, 235, 200, 0.7), transparent),
      radial-gradient(1px 1px at 8% 58%, rgba(255, 220, 180, 0.4), transparent),
      radial-gradient(1.5px 1.5px at 48% 8%, rgba(255, 240, 210, 0.6), transparent),
      radial-gradient(1px 1px at 68% 88%, rgba(255, 230, 190, 0.5), transparent);
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.4; } 100% { opacity: 1; } }

  /* === LUCIÉRNAGAS === */
  .fireflies { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .firefly {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 230, 140, 1) 0%, rgba(255, 200, 100, 0.5) 40%, transparent 70%);
    opacity: 0;
  }
  @keyframes float-1 {
    0%   { transform: translate(0, 0) scale(0.7); opacity: 0; }
    10%  { opacity: 0.95; }
    50%  { transform: translate(35vw, -25vh) scale(1.3); opacity: 0.7; }
    100% { transform: translate(70vw, -8vh) scale(0.9); opacity: 0; }
  }
  @keyframes float-2 {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    15%  { opacity: 0.85; }
    50%  { transform: translate(-25vw, -35vh) scale(0.7); opacity: 1; }
    100% { transform: translate(-50vw, 8vh) scale(1.1); opacity: 0; }
  }
  @keyframes float-3 {
    0%   { transform: translate(0, 0) scale(0.9); opacity: 0; }
    20%  { opacity: 1; }
    50%  { transform: translate(18vw, -45vh) scale(1.4); opacity: 0.7; }
    100% { transform: translate(45vw, -70vh) scale(0.8); opacity: 0; }
  }
  @keyframes glow-pulse {
    0%, 100% { box-shadow: 0 0 10px 2px rgba(255, 220, 130, 0.6), 0 0 20px 6px rgba(255, 200, 100, 0.3); }
    50%      { box-shadow: 0 0 18px 5px rgba(255, 235, 160, 0.9), 0 0 36px 10px rgba(255, 210, 120, 0.45); }
  }

  /* === STAGE PRINCIPAL === */
  .stage {
    position: relative;
    width: 100%; height: 100%;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 5vh 4vw 12vh 4vw;
    opacity: 0;
    transform: scale(0.96);
    transition: opacity 1.4s ease-in-out, transform 1.4s ease-in-out;
    pointer-events: none;
    gap: 3vh;
  }
  .slide.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* === FOTO === */
  .photo-frame {
    position: relative;
    width: min(90vw, 480px);
    aspect-ratio: 4 / 3;
    border-radius: 22px;
    overflow: hidden;
    box-shadow:
      0 0 50px 10px rgba(255, 180, 120, 0.22),
      0 0 100px 25px rgba(255, 160, 100, 0.12),
      0 25px 70px rgba(0, 0, 0, 0.65);
    background: #1a1228;
  }
  .photo-frame .img {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 22px;
    animation: kenBurns 12s ease-out infinite alternate;
  }
  @keyframes kenBurns {
    0%   { transform: scale(1.02) translate(0, 0); }
    100% { transform: scale(1.12) translate(-2%, -1.5%); }
  }
  .photo-frame::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 22px;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.45);
    pointer-events: none;
    z-index: 2;
  }
  .photo-frame .loader {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255, 230, 200, 0.5);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    z-index: 3;
    transition: opacity 0.6s;
  }
  .photo-frame .loader.hide { opacity: 0; }
  .photo-frame .loader::before {
    content: "♡";
    margin-right: 8px;
    animation: heartBeat 1.8s ease-in-out infinite;
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50%      { transform: scale(1.25); opacity: 1; }
  }

  /* === FRASE === */
  .quote {
    max-width: min(90vw, 520px);
    text-align: center;
    color: #f5e6d3;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.1rem, 4.2vw, 1.6rem);
    line-height: 1.5;
    letter-spacing: 0.02em;
    text-shadow:
      0 0 20px rgba(255, 200, 150, 0.3),
      0 2px 8px rgba(0, 0, 0, 0.7);
    padding: 0 0.5rem;
  }
  .quote::before {
    content: '';
    display: block;
    width: 50px;
    height: 1px;
    margin: 0 auto 1rem auto;
    background: linear-gradient(90deg, transparent, rgba(255, 200, 150, 0.6), transparent);
  }

  /* === CONTROLES === */
  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(255, 220, 180, 0.10);
    border: 1px solid rgba(255, 220, 180, 0.30);
    color: rgba(255, 230, 200, 0.85);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 50;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.3s, transform 0.2s;
  }
  .nav-btn:hover { background: rgba(255, 220, 180, 0.20); }
  .nav-btn:active { transform: translateY(-50%) scale(0.92); }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn.prev { left: 12px; }
  .nav-btn.next { right: 12px; }

  /* === INDICADORES === */
  .dots {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 50;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: rgba(255, 220, 180, 0.25);
    cursor: pointer;
    transition: all 0.4s;
    border: none;
    padding: 0;
  }
  .dot.active {
    background: rgba(255, 200, 150, 0.95);
    width: 28px;
    border-radius: 5px;
    box-shadow: 0 0 12px rgba(255, 200, 150, 0.6);
  }

  /* === BARRA DE PROGRESO === */
  .progress {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg, rgba(255, 200, 150, 0.4), rgba(255, 230, 180, 0.9));
    width: 0%;
    z-index: 60;
    box-shadow: 0 0 10px rgba(255, 200, 150, 0.6);
    transition: width 0.3s linear;
  }

  /* === BOTÓN DE MÚSICA === */
  .audio-btn {
    position: fixed;
    top: 14px; right: 14px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255, 220, 180, 0.10);
    border: 1px solid rgba(255, 220, 180, 0.30);
    color: rgba(255, 230, 200, 0.85);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 50;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.3s, transform 0.2s;
  }
  .audio-btn:active { transform: scale(0.92); }
  .audio-btn svg { width: 20px; height: 20px; }
  .audio-btn.playing {
    background: rgba(255, 200, 150, 0.25);
    box-shadow: 0 0 18px rgba(255, 200, 150, 0.5);
  }

  /* === PANTALLA INICIAL === */
  .start-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    background: rgba(5, 3, 9, 0.97);
    text-align: center;
    padding: 2rem;
    transition: opacity 1.5s ease, visibility 1.5s ease;
  }
  .start-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .start-screen h1 {
    font-family: 'Marcellus', serif;
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    letter-spacing: 0.2em;
    margin-bottom: 1rem;
    color: #f5e6d3;
    opacity: 0;
    animation: fadeUp 1.5s ease-out 0.3s forwards;
  }
  .start-screen p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 3.8vw, 1.2rem);
    color: rgba(245, 230, 211, 0.7);
    margin-bottom: 2.5rem;
    max-width: 320px;
    opacity: 0;
    animation: fadeUp 1.5s ease-out 0.8s forwards;
  }
  .start-btn {
    padding: 14px 38px;
    border-radius: 50px;
    background: linear-gradient(135deg, rgba(255, 200, 150, 0.20), rgba(255, 170, 120, 0.15));
    border: 1px solid rgba(255, 200, 150, 0.5);
    color: #f5e6d3;
    font-family: 'Marcellus', serif;
    font-size: clamp(1rem, 4vw, 1.15rem);
    letter-spacing: 0.15em;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
    opacity: 0;
    animation: fadeUp 1.5s ease-out 1.3s forwards, btnGlow 3s ease-in-out 2.5s infinite;
    box-shadow: 0 0 30px rgba(255, 200, 150, 0.25);
  }
  .start-btn:active { transform: scale(0.96); }
  @keyframes fadeUp {
    0%   { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes btnGlow {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 200, 150, 0.25); }
    50%      { box-shadow: 0 0 50px rgba(255, 200, 150, 0.55); }
  }
  .start-heart {
    font-size: 2.5rem;
    color: #ffb088;
    margin-bottom: 1rem;
    text-shadow: 0 0 25px rgba(255, 170, 120, 0.7);
    animation: heartBeat 2s ease-in-out infinite;
  }

  /* === FINAL === */
  .ending {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 90;
    background: rgba(5, 3, 9, 0.92);
    color: #f5e6d3;
    text-align: center;
    padding: 2rem;
    opacity: 0;
    transition: opacity 2s ease;
  }
  .ending.show { display: flex; opacity: 1; }
  .ending .heart {
    font-size: clamp(2.5rem, 9vw, 4rem);
    color: #ffb088;
    text-shadow: 0 0 35px rgba(255, 170, 120, 0.7);
    margin-bottom: 1.2rem;
    animation: heartBeat 2s ease-in-out infinite;
  }
  .ending .final-text {
    font-family: 'Marcellus', serif;
    font-size: clamp(1.5rem, 5.5vw, 2.2rem);
    letter-spacing: 0.15em;
    margin-bottom: 0.5rem;
  }
  .ending .signed {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 3.8vw, 1.3rem);
    opacity: 0.8;
    margin-bottom: 2rem;
  }
  .ending .replay {
    padding: 12px 30px;
    border-radius: 50px;
    background: rgba(255, 200, 150, 0.15);
    border: 1px solid rgba(255, 200, 150, 0.4);
    color: #f5e6d3;
    font-family: 'Marcellus', serif;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .ending .replay:active { transform: scale(0.96); }

</style>
</head>

<script>
  const foto1 = "https://photos.fife.usercontent.google.com/pw/AP1GczNyHKrV-IqZUaOdtLC60C9-CTEjmhqi5ObrJTcQgSXMcq9_iYB-nqL1cA=w878-h494-s-no-gm?authuser=0";
  const foto2 = "https://photos.fife.usercontent.google.com/pw/AP1GczNI3Uvw7L3bYVk0T7KQrHDtCSOkTlwP515olnUcKQ7P6KYG8V97d2fY_g=w878-h494-s-no-gm?authuser=0";
  const foto3 = "https://photos.fife.usercontent.google.com/pw/AP1GczOYtrIErzKPGWRode_nzMCrLCh0WnGC7rNpNcx0tAwihcrUKLMVVw4Ptw=w878-h878-s-no-gm?authuser=0";
  const foto4 = "https://photos.fife.usercontent.google.com/pw/AP1GczP-i2KKWsZemK_ZKQwQi8C4sofrmfQ6trQU9TOclgKkPbWy75DvOLN15w=w878-h659-s-no-gm?authuser=0";
  const foto5 = "https://photos.fife.usercontent.google.com/pw/AP1GczNBOzBNj-HyjTYkONGrfKDUcs9W-Zatfb-thGevZQIB_v6kdLD2tTn0-Q=w878-h659-s-no-gm?authuser=0";
</script>
<!-- ================================== -->

<div class="sky"></div>
<div class="fireflies" id="fireflies"></div>

<div class="progress" id="progress"></div>

<div class="stage" id="stage"></div>

<button class="nav-btn prev" id="prevBtn" aria-label="Anterior">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"></polyline>
  </svg>
</button>

<button class="nav-btn next" id="nextBtn" aria-label="Siguiente">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="9 18 15 12 9 6"></polyline>
  </svg>
</button>

<div class="dots" id="dots"></div>

<button class="audio-btn playing" id="audioBtn" aria-label="Música">
  <svg id="audioIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"></path>
    <circle cx="6" cy="18" r="3"></circle>
    <circle cx="18" cy="16" r="3"></circle>
  </svg>
</button>

<div class="start-screen" id="startScreen">
  <div class="start-heart">♡</div>
  <h1>Para Belén</h1>
  <p>Una pequeña sorpresa hecha con magia, gatos y un puñado de luciérnagas.</p>
  <button class="start-btn" id="startBtn">Comenzar</button>
</div>

<div class="ending" id="ending">
  <div class="heart">♡</div>
  <div class="final-text">Te amo, Belén.</div>
  <div class="signed">— Nico</div>
  <button class="replay" id="replayBtn">Ver de nuevo</button>
</div>

<script>
  // ============================================
  //   FRASES
  // ============================================
  const frases = [
    "Hay magia en lo simple: en tu voz despertando la casa, en el ronroneo a los pies de la cama, en el café que humea mientras me mirás.",
    "Si la vida fuera una película de Ghibli, vos serías la luz que cruza la ventana, el viento tibio entre los árboles, el silencio que lo dice todo.",
    "Te elijo en los días grises y en las siestas de domingo, cuando los gatos se acomodan entre nosotros y el mundo entero se vuelve pequeño y nuestro.",
    "Tenés esa manera de hacer hogar donde antes solo había paredes. Caminás, y todo florece. Sonreís, y la noche se vuelve cálida.",
    "Quiero seguir construyendo con vos esta vida de pequeñas magias: vos, yo, los gatos, y todas las primaveras que nos queden."
  ];
  const fotos = [foto1, foto2, foto3, foto4, foto5];

  // ============================================
  //   CONSTRUCCIÓN DE SLIDES
  // ============================================
  const stage = document.getElementById('stage');
  const dotsContainer = document.getElementById('dots');

  fotos.forEach((url, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = `
      <div class="photo-frame">
        <div class="loader" id="loader-${i}">cargando recuerdo</div>
        <div class="img" id="img-${i}"></div>
      </div>
      <div class="quote">${frases[i]}</div>
    `;
    stage.appendChild(slide);

    // Precarga
    const tester = new Image();
    tester.onload = () => {
      document.getElementById('img-' + i).style.backgroundImage = `url("${url}")`;
      document.getElementById('loader-' + i).classList.add('hide');
    };
    tester.onerror = () => {
      const loader = document.getElementById('loader-' + i);
      loader.innerHTML = '✿ recuerdo nº ' + (i + 1);
      loader.style.opacity = '0.6';
    };
    tester.src = url;

    // Dot
    const dot = document.createElement('button');
    dot.className = 'dot';
    dot.setAttribute('aria-label', 'Ir a slide ' + (i + 1));
    dot.addEventListener('click', () => goTo(i));
    dotsContainer.appendChild(dot);
  });

  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  let current = 0;
  let autoTimer = null;
  let progressTimer = null;
  const SLIDE_MS = 8000;

  function vibrate(ms = 12) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  function updateProgress() {
    const bar = document.getElementById('progress');
    let start = Date.now();
    clearInterval(progressTimer);
    bar.style.width = '0%';
    progressTimer = setInterval(() => {
      const pct = Math.min(100, ((Date.now() - start) / SLIDE_MS) * 100);
      bar.style.width = pct + '%';
      if (pct >= 100) clearInterval(progressTimer);
    }, 50);
  }

  function show(i) {
    current = (i + slides.length) % slides.length;
    slides.forEach((s, idx) => s.classList.toggle('active', idx === current));
    dots.forEach((d, idx) => d.classList.toggle('active', idx === current));
    vibrate();
    updateProgress();
  }

  function next() {
    if (current === slides.length - 1) {
      stopAuto();
      showEnding();
      return;
    }
    show(current + 1);
    restartAuto();
  }

  function prev() {
    show(current - 1);
    restartAuto();
  }

  function goTo(i) {
    show(i);
    restartAuto();
  }

  function startAuto() {
    stopAuto();
    autoTimer = setInterval(() => {
      if (current === slides.length - 1) {
        stopAuto();
        showEnding();
      } else {
        show(current + 1);
      }
    }, SLIDE_MS);
  }

  function stopAuto() {
    if (autoTimer) clearInterval(autoTimer);
    if (progressTimer) clearInterval(progressTimer);
    document.getElementById('progress').style.width = '0%';
  }

  function restartAuto() {
    stopAuto();
    startAuto();
  }

  function showEnding() {
    document.getElementById('ending').classList.add('show');
    vibrate(40);
  }

  function hideEnding() {
    document.getElementById('ending').classList.remove('show');
  }

  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);

  // Teclado
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('startScreen').classList.contains('hidden')) {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    }
  });

  // Swipe táctil
  let touchStartX = 0;
  let touchEndX = 0;
  stage.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    const diff = touchEndX - touchStartX;
    if (Math.abs(diff) > 50) {
      if (diff < 0) next();
      else prev();
    }
  }, { passive: true });

  // ============================================
  //   LUCIÉRNAGAS
  // ============================================
  const ff = document.getElementById('fireflies');
  const isMobile = window.innerWidth < 768;
  const N_FIRE = isMobile ? 14 : 22;
  for (let i = 0; i < N_FIRE; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    f.style.left = (Math.random() * 100) + 'vw';
    f.style.top  = (Math.random() * 100) + 'vh';
    const t = (i % 3) + 1;
    const dur = 14 + Math.random() * 14;
    const del = Math.random() * 18;
    f.style.animation = `float-${t} ${dur}s ease-in-out ${del}s infinite, glow-pulse ${2 + Math.random() * 3}s ease-in-out infinite`;
    ff.appendChild(f);
  }

  // ============================================
  //   MÚSICA 8-BIT ROMÁNTICA (Web Audio API)
  // ============================================
  // Genera una melodía chiptune en bucle. Sin archivos externos.
  let audioCtx = null;
  let masterGain = null;
  let musicPlaying = false;
  let nextNoteTime = 0;
  let currentStep = 0;
  let lookaheadTimer = null;

  // Notas en Hz (escala de Do mayor, octavas medias)
  const NOTE = {
    'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
    'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00, 'B5': 987.77,
    'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
    'C6': 1046.50, 'REST': 0
  };

  // Melodía romántica chiptune (compases de 4 tiempos, 16 pasos por compás)
  // Patrón principal — vibra dulce, tipo Ghibli/Zelda
  const melody = [
    'E5','REST','G5','REST','A5','REST','G5','E5',  'C5','REST','D5','REST','E5','REST','D5','C5',
    'D5','REST','F5','REST','G5','REST','F5','D5',  'B4','REST','C5','REST','D5','REST','C5','B4',
    'C5','REST','E5','REST','G5','REST','E5','C5',  'A4','REST','B4','REST','C5','REST','B4','A4',
    'G4','REST','A4','REST','B4','REST','C5','D5',  'E5','REST','D5','C5','D5','REST','REST','REST'
  ];
  // Bajo (acordes simples I-V-vi-IV)
  const bass = [
    'C3','REST','REST','REST','G3','REST','REST','REST',  'C3','REST','REST','REST','G3','REST','REST','REST',
    'G3','REST','REST','REST','D3','REST','REST','REST',  'G3','REST','REST','REST','D3','REST','REST','REST',
    'A3','REST','REST','REST','E3','REST','REST','REST',  'A3','REST','REST','REST','E3','REST','REST','REST',
    'F3','REST','REST','REST','C3','REST','REST','REST',  'F3','REST','REST','REST','G3','REST','REST','REST'
  ];
  // Arpegio cristalino arriba
  const arp = [
    'E5','G5','C6','G5','E5','G5','C6','G5','E5','G5','C6','G5','E5','G5','C6','G5',
    'D5','G5','B5','G5','D5','G5','B5','G5','D5','G5','B5','G5','D5','G5','B5','G5',
    'E5','A5','C6','A5','E5','A5','C6','A5','E5','A5','C6','A5','E5','A5','C6','A5',
    'C5','F5','A5','F5','C5','F5','A5','F5','C5','F5','A5','F5','D5','G5','B5','G5'
  ];

  const STEPS = melody.length;
  const TEMPO = 100; // bpm
  const stepDur = 60 / TEMPO / 2; // semicorchea

  function playNote(freq, time, dur, type, gain) {
    if (freq === 0) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(g);
    g.connect(masterGain);
    // envelope tipo 8-bit (attack rápido, decay)
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(gain, time + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.start(time);
    osc.stop(time + dur + 0.02);
  }

  function scheduleStep(step, time) {
    const m = melody[step];
    const b = bass[step];
    const a = arp[step];
    if (m && NOTE[m] !== undefined)  playNote(NOTE[m], time, stepDur * 1.8, 'square',   0.08);
    if (b && NOTE[b] !== undefined)  playNote(NOTE[b], time, stepDur * 3.0, 'triangle', 0.14);
    if (a && NOTE[a] !== undefined)  playNote(NOTE[a], time, stepDur * 0.9, 'square',   0.025);
  }

  function scheduler() {
    while (nextNoteTime < audioCtx.currentTime + 0.15) {
      scheduleStep(currentStep, nextNoteTime);
      nextNoteTime += stepDur;
      currentStep = (currentStep + 1) % STEPS;
    }
  }

  function startMusic() {
    if (musicPlaying) return;
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35;
      // Filtro low-pass para que suene más cálido
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 3200;
      masterGain.connect(filter);
      filter.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    nextNoteTime = audioCtx.currentTime + 0.05;
    currentStep = 0;
    musicPlaying = true;
    lookaheadTimer = setInterval(scheduler, 25);
    document.getElementById('audioBtn').classList.add('playing');
    setAudioIcon(true);
  }

  function stopMusic() {
    musicPlaying = false;
    if (lookaheadTimer) clearInterval(lookaheadTimer);
    if (masterGain) {
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
      setTimeout(() => { if (masterGain) masterGain.gain.value = 0.35; }, 400);
    }
    document.getElementById('audioBtn').classList.remove('playing');
    setAudioIcon(false);
  }

  function setAudioIcon(playing) {
    const icon = document.getElementById('audioIcon');
    if (playing) {
      icon.innerHTML = '<path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>';
    } else {
      icon.innerHTML = '<path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle><line x1="2" y1="2" x2="22" y2="22" stroke-width="2"></line>';
    }
  }

  document.getElementById('audioBtn').addEventListener('click', () => {
    if (musicPlaying) stopMusic();
    else startMusic();
  });

  // ============================================
  //   START / REPLAY
  // ============================================
  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startScreen').classList.add('hidden');
    show(0);
    startAuto();
    startMusic(); // arranca la música con el gesto del usuario
  });

  document.getElementById('replayBtn').addEventListener('click', () => {
    hideEnding();
    show(0);
    startAuto();
  });

</script>

</body>
